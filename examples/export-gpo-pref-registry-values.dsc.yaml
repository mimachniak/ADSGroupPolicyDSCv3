# Exports preference registry items into a usable configuration document.
# Run with: dsc config export -f export-gpo-pref-registry-values.dsc.yaml -o yaml > gpo-pref-registry-values-current.dsc.yaml
#
# Declaring 'gpoName' scopes the export to that single GPO. Omit it (or use
# export-all-resources.dsc.yaml) to export preference items for every GPO instead.
$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
resources:

  - name: DSC-Test GPO Preference Registry Policy Values
    type: ActiveDirectory.GroupPolicy/GPPrefRegistryValue
    properties:
      gpoName: DSC-Test