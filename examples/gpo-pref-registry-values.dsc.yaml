# Configures Group Policy Preference registry items inside a GPO.
# Apply:   dsc config set    -f gpo-pref-registry-values.dsc.yaml
# What-if: dsc config set -w -f gpo-pref-registry-values.dsc.yaml
# Get:     dsc config get    -f gpo-pref-registry-values.dsc.yaml
$schema: https://aka.ms/dsc/schemas/v3/bundled/config/document.json
metadata:
  Microsoft.DSC:
    securityContext: elevated
resources:

  # --- User Configuration: screen-saver security (action=Update, String) ---
  - name: Enforce screen saver password
    type: ActiveDirectory.GroupPolicy/GPPrefRegistryValue
    properties:
      gpoName:   DSC-Test
      context:   User
      key:       HKCU\Software\Policies\Microsoft\Windows\Control Panel
      valueName: ScreenSaveIsSecure
      action:    Update
      type:      String
      value:     '1'
      ensure:    Present

  # --- User Configuration: screen-saver timeout (action=Update, DWord) ---
  - name: Set screen saver timeout
    type: ActiveDirectory.GroupPolicy/GPPrefRegistryValue
    properties:
      gpoName:   DSC-Test
      context:   User
      key:       HKCU\Software\Policies\Microsoft\Windows\Control Panel\Desktop
      valueName: ScreenSaveTimeOut
      action:    Update
      type:      DWord
      value:     600
      ensure:    Present

  # --- Computer Configuration: disable lock-screen camera (action=Update, DWord) ---
  - name: Disable lock-screen camera
    type: ActiveDirectory.GroupPolicy/GPPrefRegistryValue
    properties:
      gpoName:   DSC-Test
      context:   Computer
      key:       HKEY_LOCAL_MACHINE\SOFTWARE\Policies\Microsoft\Windows\Personalization
      valueName: NoLockScreenCamera
      action:    Update
      type:      DWord
      value:     1
      ensure:    Present

  # --- Computer Configuration: create a registry key (no value, action=Create) ---
  - name: Create compliance registry key
    type: ActiveDirectory.GroupPolicy/GPPrefRegistryValue
    properties:
      gpoName: DSC-Test
      context: Computer
      key:     HKLM\SOFTWARE\Contoso\DSCManaged
      action:  Create
      ensure:  Present

  # --- User Configuration: ExpandString path ---
  - name: Set wallpaper path via preference
    type: ActiveDirectory.GroupPolicy/GPPrefRegistryValue
    properties:
      gpoName:   DSC-Test
      context:   User
      key:       HKCU\Software\Policies\Microsoft\Windows\Personalization
      valueName: DesktopImagePath
      action:    Replace
      type:      ExpandString
      value:     '%SystemRoot%\web\wallpaper\Windows\img0.jpg'
      ensure:    Present

  # --- Remove an unwanted preference item (ensure: Absent) ---
  - name: Remove legacy proxy preference
    type: ActiveDirectory.GroupPolicy/GPPrefRegistryValue
    properties:
      gpoName:   DSC-Test
      context:   User
      key:       HKCU\Software\Policies\Microsoft\Windows\CurrentVersion\Internet Settings
      valueName: ProxyEnable
      ensure:    Absent
